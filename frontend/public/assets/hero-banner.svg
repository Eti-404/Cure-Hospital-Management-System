<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2e9" />
      <stop offset="100%" stop-color="#c8e6d7" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0d9488" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Soft Abstract Organic Backdrop -->
  <path d="M480 240C480 350.457 390.457 440 280 440C169.543 440 80 350.457 80 240C80 129.543 169.543 40 280 40C390.457 40 480 129.543 480 240Z" fill="url(#mintGrad)" opacity="0.6" />
  <circle cx="440" cy="120" r="40" fill="#a7f3d0" opacity="0.4" />
  <circle cx="100" cy="380" r="30" fill="#99f6e4" opacity="0.4" />

  <!-- Stylized Modern Hospital / Medical Center -->
  <rect x="190" y="100" width="220" height="260" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
  <rect x="230" y="130" width="140" height="48" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
  <!-- Medical Cross -->
  <path d="M300 142V166M288 154H312" stroke="#0d9488" stroke-width="5" stroke-linecap="round" />

  <!-- Architectural Windows Grid -->
  <rect x="220" y="200" width="40" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <rect x="280" y="200" width="40" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <rect x="340" y="200" width="40" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <rect x="220" y="248" width="40" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <rect x="280" y="248" width="40" height="32" rx="8" fill="#0d9488" />
  <rect x="340" y="248" width="40" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Doctor Silhouette / Stethoscope Symbol -->
  <g transform="translate(200, 310)">
    <path d="M50 0C77.6142 0 100 22.3858 100 50V90H0V50C0 22.3858 22.3858 0 50 0Z" fill="url(#tealGrad)" />
    <circle cx="50" cy="-25" r="25" fill="#fde047" />
    <!-- White doctor coat collar -->
    <path d="M35 15L50 50L65 15" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M50 50V90" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Floating Badge 1: 24/7 Service -->
  <g transform="translate(60, 160)" filter="url(#cardShadow)">
    <rect width="180" height="68" rx="18" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5" />
    <circle cx="34" cy="34" r="18" fill="#dcfce7" />
    <path d="M26 34L32 40L42 28" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="62" y="30" fill="#0f172a" font-size="14" font-weight="bold" font-family="'Hind Siliguri', sans-serif">লাইভ স্লট আপডেট</text>
    <text x="62" y="48" fill="#16a34a" font-size="12" font-weight="600" font-family="'Hind Siliguri', sans-serif">১০+ বিশেষজ্ঞ ডাক্তার</text>
  </g>

  <!-- Floating Badge 2: Instant Token -->
  <g transform="translate(360, 260)" filter="url(#cardShadow)">
    <rect width="190" height="68" rx="18" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5" />
    <circle cx="34" cy="34" r="18" fill="#e0f2fe" />
    <path d="M26 34H42M34 26V42" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
    <text x="62" y="30" fill="#0f172a" font-size="14" font-weight="bold" font-family="'Hind Siliguri', sans-serif">ডিজিটাল টোকেন স্লিপ</text>
    <text x="62" y="48" fill="#0284c7" font-size="12" font-weight="600" font-family="'Hind Siliguri', sans-serif">১-ক্লিক প্রিন্ট ও ট্র্যাকিং</text>
  </g>
</svg>
